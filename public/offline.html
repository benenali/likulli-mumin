<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d5b46">
    <title>لكل مؤمن — دون اتصال</title>
    <style>
      :root{color-scheme:light;--bg:#f7f6f0;--surface:#fffefa;--text:#1e302a;--muted:#697770;--primary:#0d5b46}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
      main{width:min(100%,520px);padding:32px;border:1px solid #e4e8e1;border-radius:20px;background:var(--surface);text-align:center}
      h1{color:var(--primary);margin-top:0}p{line-height:2;color:var(--muted)}button{font:inherit;border:0;border-radius:10px;background:var(--primary);color:white;padding:12px 20px;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <h1>لكل مؤمن</h1>
      <p>أنت دون اتصال بالإنترنت الآن. إذا سبق فتح التطبيق، فقد تكون الصفحة الرئيسية وبعض الملفات محفوظة على هذا الجهاز.</p>
      <p>المحتوى الديني الكامل والقرآن ومواقيت الصلاة لم تُفعّل بعد في هذه النسخة التأسيسية.</p>
      <button type="button" onclick="location.reload()">حاول الاتصال مجددًا</button>
    </main>
  </body>
</html>
